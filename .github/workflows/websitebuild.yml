name: "SuperSpider Website Build"

on:
  push:
    branches:
      - master
      - dev
    paths:
      - "packages/superspider-showcase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
  workflow_dispatch:

jobs:
  build-gh-pages:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      BASE_API_URL: ${{ secrets.BASE_API_URL }}
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          check-latest: true
          cache: "pnpm"
      # - name: Cache node_modules 📦
      #   uses: actions/cache@v2.1.4
      #   with:
      #     path: ~/.npm
      #     key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      #     restore-keys: |
      #       ${{ runner.os }}-node-
      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Generate
        run: pnpm run -F superspider-showcase generate
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: packages/superspider-showcase/.output/public
